[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.100"

[workspace.dependencies]
tk-bus = { path = "crates/tk-bus" }
tk-term = { path = "crates/tk-term" }
tk-plugin-api = { path = "crates/tk-plugin-api" }
tk-plugin-git = { path = "plugins/tk-plugin-git" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "process", "fs", "signal", "io-std"] }
interprocess = { version = "2.2", features = ["tokio"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5"
sha2 = "0.10"
which = "7"
portable-pty = "0.9"
alacritty_terminal = "0.26"
gpui = "0.2.2"
unicode-width = "0.2.3"
pulldown-cmark = { version = "0.13", default-features = false }

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
